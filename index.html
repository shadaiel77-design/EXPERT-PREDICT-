<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXPERT PREDICT</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:15px}
.header{background:linear-gradient(135deg,#1e40af,#3b82f6);padding:20px;border-radius:15px;text-align:center;margin-bottom:20px}
.card{background:#1e293b;border-radius:12px;padding:15px;margin-bottom:15px;border:1px solid #334155}
.match{font-weight:bold;font-size:18px}
.league{color:#94a3b8;font-size:12px;margin-bottom:8px}
.tip{background:#0f172a;padding:10px;border-radius:8px;margin-top:8px}
.tip b{color:#22c55e}
.odds{color:#fbbf24}
.time{color:#60a5fa;font-size:13px;margin-top:5px}
.conf{float:right;background:#22c55e;color:#000;padding:3px 8px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1>⚽ EXPERT PREDICT</h1>
<p>Daily Expert Football Tips</p>
<p id="upd" style="font-size:11px;margin-top:8px"></p>
</div>
<div id="box" style="text-align:center;padding:30px">Loading...</div>
<script>
async function load(){
try{
let r=await fetch('./predictions.json?v='+Date.now());
let d=await r.json();
document.getElementById('upd').textContent=new Date().toLocaleString();
let h='';
d.matches.forEach(m=>{
h+=`<div class="card"><span class="conf">${m.confidence||'85%'}</span><div class="league">${m.league}</div><div class="match">${m.home} vs ${m.away}</div><div class="tip"><b>Prediction:</b> ${m.prediction}</div><div class="tip"><b>Tip:</b> ${m.tip} <span class="odds">@${m.odds}</span></div><div class="time">${m.time}</div></div>`;
});
document.getElementById('box').innerHTML=h||'No predictions yet';
}catch(e){
document.getElementById('box').innerHTML='Error loading. Refresh!<br>'+e.message;
}
}
load();
</script>
</body>
</html>
