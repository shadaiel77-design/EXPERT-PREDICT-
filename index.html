<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:#fff}
header{padding:15px;background:#111;display:flex;justify-content:space-between;align-items:center}
button{padding:10px 16px;border:0;border-radius:8px;font-weight:bold}
#bellBtn{background:#ffcc00}

<body>
<header>
<h3>🔥 EXPERT PREDICT</h3>
<div>
<button id="bellBtn">🔔 Subscribe</button>
<button id="shareBtn">Share</button>
</div>
</header>

<div id="freeTips"></div>
<div id="vipTips" class="locked"></div>

<button id="showUnlockBtn">Unlock VIP</button>
<div id="unlockBox" style="display:none">
<input id="codeInput" placeholder="Enter code">
<button id="unlockBtn">Unlock</button>
<button id="cancelBtn">Cancel</button>
<p id="err" style="color:red;display:none">Wrong code!</p>
</div>

<script>
const PRIVATE_CODE = "VIP2024";
document.getElementById('showUnlockBtn').onclick=()=>document.getElementById('unlockBox').style.display='block';
document.getElementById('cancelBtn').onclick=()=>document.getElementById('unlockBox').style.display='none';
document.getElementById('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')doUnlock()});
function doUnlock(){
 const input=document.getElementById('codeInput');
 const err=document.getElementById('err');
 if(input.value===PRIVATE_CODE){document.getElementById('vipTips').classList.remove('locked');document.getElementById('unlockBox').style.display='none';setUnlock(true)}
 else{err.style.display='block';input.value='';}
}
function setUnlock(v){localStorage.setItem('unlocked',v)}
if(localStorage.getItem('unlocked')){document.getElementById('vipTips').classList.remove('locked')}

document.addEventListener('visibilitychange',()=>{if(document.hidden){}});

document.getElementById('shareBtn').onclick=async()=>{
 const data={title:'EXPERT PREDICT VIP',text:'Get winning tips!',url:location.href};
 if(navigator.share){try{await navigator.share(data)}catch{}}
 else{alert('Share: '+location.href)}
};
</script>
