<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR ZERO</title><style>body{background:#1a1208;color:#fff;font-family:Arial;padding:15px} .ticket{background:#2c1f0f;border:2px solid #c9a86a;border-radius:12px;padding:15px;margin:15px 0;position:relative} .header{display:flex;justify-content:space-between;background:#000;padding:8px;border-radius:6px;font-weight:bold;color:#ffcc00} .stamp{position:absolute;top:40px;right:15px;border:3px solid #0f0;color:#0f0;padding:4px 12px;transform:rotate(-15deg);font-weight:bold} .odd{background:#00c853;color:#fff;padding:3px 8px;border-radius:4px;float:right} .match{border-bottom:1px solid #444;padding:8px 0} .phone{background:#25D366;color:#fff;padding:12px;text-align:center;border-radius:8px;margin-top:20px;font-weight:bold}</style></head><body><h2 style="text-align:center;color:#ffcc00">MR ZERO - HALFTIME</h2><div id="tickets">Loading...</div><div class="phone">VIP: +237673220943 - CODE: 77224</div><script>async function load(){try{let r=await fetch('./predictions.json?v='+Date.now());let d=await r.json();let h='';d.tickets.forEach(t=>{h+=`<div class=ticket><div class=header><span>MAX BET</span><span>${t.date}</span></div><div class=stamp>${t.status}</div>`;t.matches.forEach(m=>{h+=`<div class=match>${m.home} vs ${m.away}<br><small>${m.tip}</small><span class=odd>${m.odd}</span></div>`});h+=`<div style=margin-top:10px;font-weight:bold>Total: ${t.total_odd}</div></div>`});document.getElementById('tickets').innerHTML=h}catch(e){document.getElementById('tickets').innerHTML='No data'}}load();setInterval(load,10000);</script></body></html>
