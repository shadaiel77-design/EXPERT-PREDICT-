<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title><style>body{background:#0f0f0f;color:#fff;font-family:Arial;padding:15px}input,select,button{padding:10px;margin:5px;border-radius:6px;border:none;width:90%}button{background:#00c853;color:#fff;font-weight:bold;cursor:pointer;width:95%}.row{display:flex;gap:5px;flex-wrap:wrap;background:#333;padding:8px;border-radius:6px;margin:5px 0}</style></head><body><h2 style="color:#ffcc00">MR ZERO ADMIN</h2><div id="loginBox"><input type="password" id="code" placeholder="Admin Code 77224"><br><button onclick="login()">LOGIN</button></div><div id="adminBox" style="display:none">Date: <input type="date" id="date" value="2026-09-17"> Status: <select id="status"><option>WON</option><option>PENDING</option><option>LOST</option></select> Total Odd: <input id="totalOdd" value="5.28"><h3>Matches</h3><div id="matches"></div><button onclick="addMatch()" style="background:#2196F3">+ Add Match</button><br><br><button onclick="save()" style="background:#ffcc00;color:#000;font-size:18px;padding:15px">SAVE & UPDATE LIVE</button><button onclick="downloadJson()" style="background:#555">Download predictions.json</button><h3>Preview:</h3><pre id="preview" style="background:#000;padding:10px;overflow:auto;font-size:12px"></pre></div><script>let matches=[{home:"Chelsea",away:"Arsenal",tip:"Draw HT",odd:"2.20",result:"WON"},{home:"Barcelona",away:"Real Madrid",tip:"Over 1.5 HT",odd:"2.40",result:"PENDING"}];function login(){if(document.getElementById('code').value=='77224'){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';render();updatePreview();}else alert('Wrong code!');}function render(){let h='';matches.forEach((m,i)=>{h+=`<div class=row><input value="${m.home}" oninput="matches[${i}].home=this.value;updatePreview()"><input value="${m.away}" oninput="matches[${i}].away=this.value;updatePreview()"><input value="${m.tip}" oninput="matches[${i}].tip=this.value;updatePreview()" style="width:80px"><input value="${m.odd}" oninput="matches[${i}].odd=this.value;updatePreview()" style="width:60px"><button onclick="matches.splice(${i},1);render();updatePreview()" style="width:40px;background:red">X</button></div>`});document.getElementById('matches').innerHTML=h;}function addMatch(){matches.push({home:"",away:"",tip:"Draw HT",odd:"2.00",result:"PENDING"});render();updatePreview();}function getData(){return{tickets:[{date:document.getElementById('date').value,league:"MAX BET",matches:matches,total_odd:document.getElementById('totalOdd').value,status:document.getElementById('status').value}],phone:"+237673220943",brand:"MR ZERO"}}function updatePreview(){document.getElementById('preview').textContent=JSON.stringify(getData(),null,2);}function save(){alert('SAVED LOCALLY! Now tap Download and upload new predictions.json to GitHub to make LIVE for all!');}function downloadJson(){let s="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(getData(),null,2));let a=document.createElement('a');a.href=s;a.download='predictions.json';a.click();}</script></body></html>
